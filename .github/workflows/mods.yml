name: Mod CI and releases

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mods-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  syntax:
    name: Script, data and workflow syntax
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check repository boundaries and source syntax
        run: |
          python tools/check_repository.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/check_syntax.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git show --format= --check HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check GitHub Actions workflows
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'actionlint.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'actionlint'
          Invoke-WebRequest 'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_windows_amd64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9') {
            throw 'actionlint archive checksum mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          & (Join-Path $destination 'actionlint.exe') -color -shellcheck= -pyflakes=
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  build:
    name: Lua tests and packages
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.10.7'
          enable-cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Test and package Vortex game support
        run: |
          node --test vortex-extension/tests/*.test.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python vortex-extension/build.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vortex-extension
          path: outputs/vortex-extension/
          if-no-files-found: error
          retention-days: 14
      - name: Validate versions and test package checks
        run: |
          python tools/ci.py validate
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tools/tests -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run Lua tests and build verified packages
        run: python tools/ci.py build
      - name: Check release eligibility without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python tools/release.py check --repository "$env:RELEASE_REPOSITORY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mod-packages
          path: outputs/ci/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish new CHANGELOG versions
    needs: [syntax, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: mod-packages
          path: outputs/ci/
      - name: Verify assets and publish new authorized versions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python tools/release.py publish --repository "$RELEASE_REPOSITORY" --commit "$RELEASE_COMMIT"
